name: Test exclude labels option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labels YAML file
        run: |
          mkdir -p .github
          cat > .github/labels.yml << 'EOF'
          - name: "bug"
            color: "d73a4a"
            description: "Something isn't working"
          - name: "enhancement"
            color: "a2eeef"
            description: "New feature or request"
          - name: "internal"
            color: "cccccc"
            description: "Internal label to exclude"
          EOF

      - id: action
        uses: .
        with:
          yaml-file: '.github/labels.yml'
          exclude: |
            internal
          dry-run: 'true'
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with exclude option
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure due to API limits in act),
          # but should not crash due to invalid exclude configuration.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with exclude option (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
