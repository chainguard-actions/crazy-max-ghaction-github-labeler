name: Test custom yaml-file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom labels YAML file
        run: |
          mkdir -p config
          cat > config/my-labels.yml << 'EOF'
          - name: "bug"
            color: "d73a4a"
            description: "Something isn't working"
          - name: "feature"
            color: "84b6eb"
            description: "A new feature"
          EOF

      - id: action
        uses: .
        with:
          yaml-file: 'config/my-labels.yml'
          dry-run: 'true'
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with custom yaml path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure due to API limits in act),
          # but should not crash due to missing yaml file.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom yaml-file path (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
