name: Test exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create labels YAML file
        run: |
          mkdir -p .github
          cat > .github/labels.yml << 'EOF'
          - name: bug
            color: "d73a4a"
            description: "Something isn't working"
          - name: enhancement
            color: "a2eeef"
            description: "New feature or request"
          - name: wontfix
            color: "ffffff"
            description: "This will not be worked on"
          EOF

      - id: action
        uses: .
        with:
          yaml-file: '.github/labels.yml'
          dry-run: 'true'
          skip-delete: 'true'
          exclude: |
            wontfix
          github-token: ${{ github.token }}

      - name: Assert action completed with exclude input
        run: |
          echo "Action completed in dry-run mode with exclude input"
          echo "PASS"
